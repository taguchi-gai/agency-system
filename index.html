<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除菌消臭 事業管理システム（モック v2）</title>
<style>
  :root {
    --primary: #1a6fb0;
    --primary-dark: #135a91;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #2c3e50;
    --muted: #7f8c9b;
    --border: #e3e8ee;
    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;
    --purple: #8e44ad;
    --sidebar-w: 230px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ===== ログイン画面 ===== */
  #login-screen {
    position: fixed; inset: 0; background: linear-gradient(135deg, #20304a, #1a6fb0);
    display: flex; align-items: center; justify-content: center; z-index: 500;
  }
  .login-box { background: #fff; border-radius: 14px; padding: 36px 40px; width: 420px; max-width: 92vw; }
  .login-box h1 { font-size: 18px; text-align: center; }
  .login-box .sub { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 24px; }
  .role-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px;
    text-align: left; transition: all .15s;
  }
  .role-btn:hover { border-color: var(--primary); background: #f2f8fd; }
  .role-btn .icon { font-size: 22px; }
  .role-btn b { display: block; }
  .role-btn small { color: var(--muted); font-size: 11px; }
  .login-select { margin-top: 4px; margin-bottom: 14px; }
  .login-select select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

  /* ===== レイアウト ===== */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
    background: #20304a; color: #fff; padding: 16px 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .sidebar h1 { font-size: 14px; padding: 8px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.15); }
  .sidebar h1 small { display: block; font-size: 10px; color: #9db4d0; font-weight: normal; margin-top: 4px; }
  .role-banner { padding: 10px 18px; font-size: 11px; background: rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.1); }
  .role-banner b { display: block; font-size: 13px; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; cursor: pointer; color: #c5d3e6; transition: background .15s; font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,.08); }
  .nav-item.active { background: var(--primary); color: #fff; }
  .logout { margin-top: auto; padding: 14px 18px; color: #9db4d0; cursor: pointer; font-size: 12px; border-top: 1px solid rgba(255,255,255,.1); }
  .logout:hover { color: #fff; }
  .main { margin-left: var(--sidebar-w); padding: 24px 28px; }
  /* スマホ用の上部バー（狭い画面でだけ表示し、サイドバーを開閉する） */
  .topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #20304a; color: #fff; align-items: center; gap: 12px; padding: 0 14px; z-index: 60; }
  .topbar .menu-btn { background: none; border: none; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 6px; }
  .topbar .title { font-size: 13px; font-weight: bold; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,35,.5); z-index: 55; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 20px; margin-bottom: 4px; }
  .page-desc { color: var(--muted); margin-bottom: 20px; font-size: 13px; }

  /* ===== 部品 ===== */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .card:has(table) { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 25px; font-weight: bold; margin-top: 6px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  .clickable { cursor: pointer; }
  .link { color: var(--primary); cursor: pointer; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .b-blue { background: #eaf2fb; color: var(--primary); }
  .b-green { background: #e8f8ef; color: var(--success); }
  .b-orange { background: #fef5e7; color: var(--warning); }
  .b-red { background: #fdecea; color: var(--danger); }
  .b-purple { background: #f0eafb; color: var(--purple); }
  .b-gray { background: #eef1f5; color: var(--muted); }

  .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,35,.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; padding: 24px 28px; }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: bold; }
  .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 16px; }
  .detail-item { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .detail-item .k { font-size: 11px; color: var(--muted); }
  .detail-item .v { font-size: 14px; margin-top: 2px; }
  .section-title { font-size: 14px; font-weight: bold; margin: 18px 0 10px; padding-left: 8px; border-left: 3px solid var(--primary); }

  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .alert-warn { background: #fef5e7; color: #b9770e; }
  .alert-danger { background: #fdecea; color: #c0392b; }
  .alert-info { background: #eaf2fb; color: var(--primary-dark); }
  .alert-shipping { background: #fff7e6; color: #8a5a00; border-left: 5px solid var(--warning); font-size: 16px; font-weight: bold; padding: 14px 18px; }
  .alert-shipping small { display: block; font-size: 12px; font-weight: normal; margin-top: 4px; color: #a06d00; }

  .flow-steps { display: flex; gap: 0; margin: 8px 0 18px; flex-wrap: wrap; }
  .flow-step { padding: 7px 22px 7px 28px; background: #eef1f5; color: var(--muted); font-size: 12px; font-weight: bold; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
  .flow-step.done { background: var(--primary); color: #fff; }

  .proto-note { font-size: 11px; color: #9db4d0; padding: 12px 18px; }

  /* ===== 注文フォーム（お客さま向け） ===== */
  .customer-form-wrap { max-width: 520px; margin: 0 auto; }
  .qr-banner { background: #fff; border: 2px dashed var(--primary); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 13px; }
  .qr-banner b { color: var(--primary); }
  .price-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-size: 13px; }
  .price-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .price-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: bold; font-size: 15px; color: var(--primary-dark); }
  .two-col { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

  /* ===== 一覧の絞り込み・並べ替え ===== */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .flt { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); font-weight: bold; }
  .flt select, .flt input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; font-family: inherit; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--primary); }
  th.sortable .sort-arrow { font-size: 10px; margin-left: 4px; color: var(--muted); }

  /* ===== 請求書（プレビュー・印刷） ===== */
  .invoice-doc { background: #fff; color: #222; padding: 28px 32px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .invoice-doc h1 { font-size: 22px; letter-spacing: .3em; text-align: center; margin: 0 0 18px; }
  .invoice-doc .inv-head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .invoice-doc .inv-to { font-size: 16px; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 4px; min-width: 240px; }
  .invoice-doc .inv-meta { font-size: 12px; text-align: right; }
  .invoice-doc .inv-total { font-size: 18px; font-weight: bold; margin: 12px 0 16px; padding: 10px 14px; border: 2px solid #222; display: inline-block; }
  .invoice-doc table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .invoice-doc th, .invoice-doc td { border: 1px solid #999; padding: 6px 10px; font-size: 12.5px; color: #222; }
  .invoice-doc th { background: #f0f0f0; text-align: center; }
  .invoice-doc td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .invoice-doc .inv-issuer { font-size: 12px; margin-top: 16px; }
  .invoice-doc .inv-note { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
  .modal:has(.inv-lines), .modal:has(.invoice-doc) { max-width: 860px; }
  .inv-lines input, .inv-lines select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .inv-lines input[type=number] { width: 84px; text-align: right; }
  @media print {
    body * { visibility: hidden; }
    .invoice-doc, .invoice-doc * { visibility: visible; }
    .invoice-doc { position: absolute; left: 0; top: 0; width: 100%; border: none; border-radius: 0; }
    .modal-bg { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; }
    .modal { max-width: none; box-shadow: none; padding: 0; }
  }

  /* ===== スマホ・タブレット（狭い画面） ===== */
  @media (max-width: 820px) {
    /* サイドバーは通常隠しておき、メニューボタンで引き出す */
    .sidebar { transform: translateX(-100%); transition: transform .22s ease; z-index: 56; width: 250px; padding-top: 60px; }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,.35); }
    .sidebar-backdrop.open { display: block; }
    .topbar { display: flex; }
    .main { margin-left: 0; padding: 68px 14px 32px; }

    .page-title { font-size: 18px; }
    .page-desc { font-size: 12px; margin-bottom: 16px; }
    /* 統計カードは2列、極端に狭ければ1列 */
    .cards-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { padding: 14px 14px; }
    .stat-value { font-size: 21px; }
    /* 入力フォームは1列に落とす（2列だと潰れて読めない） */
    .form-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    /* モーダルは画面いっぱいに近づけ、余白を詰める */
    .modal-bg { padding: 16px 10px; }
    .modal { padding: 18px 16px; }
    .modal h2 { font-size: 16px; }
    /* ツールバーのボタンは折り返して全幅に */
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .btn { width: 100%; }
    /* 一覧テーブルは横スクロールで見る。詰まりすぎないよう最低幅を確保 */
    .card:has(table) table { min-width: 560px; }
    .card:has(table) { padding: 0; }
    .flow-steps { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .flow-step { flex: 0 0 auto; }
  }
</style>
</head>
<body>

<!-- ===== ログイン画面（ロール選択） ===== -->
<div id="login-screen">
  <div class="login-box">
    <h1>🚗 除菌消臭 事業管理システム</h1>
    <div class="sub">モック v2 — ログインするロールを選んでください（実際はID/パスワード認証）</div>
    <div id="role-select-area"></div>
  </div>
</div>

<!-- ===== スマホ用の上部バー ===== -->

<main class="main" id="main" style="display:none"></main>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>

<script src="car-dictionary.js"></script>
<script>
// =====================================================
// サンプルデータ
// =====================================================
// モック固定の「本日」。サンプルデータとの整合性のため固定日付にしている。
// 新規注文の注文日などは自動でこの値が入る仕組みで、本番では実際の当日の日付になる。
const TODAY = "2026-06-11";

// 施工売上の配分ルール（本部確定）。
// 売上から決済代行会社（カード会社等）の手数料を引いた金額をベースに、
// 本部10% / 取次店10% / 施工代理店80% で配分する。
// 決済代行会社が未定のため paymentFeeRate のみ仮置き。決まったらこの値を入れ替えれば全画面に反映される。
const commissionSettings = {
  hqRate: 0.10,          // 本部の取り分
  shopRate: 0.10,        // 取次店の取り分
  contractorRate: 0.80,  // 施工代理店の取り分
  paymentFeeRate: 0.035, // 決済代行会社の手数料率（仮。決済代行会社が決まり次第この値を差し替える）
  paymentFeeConfirmed: false, // 決済代行会社が決まったら true
};
// 1案件ぶんの配分を計算する。
// 各取り分をそれぞれ四捨五入すると合計が元の売上とズレるため（例：85,800円で1円不足）、
// 振込額になる取次店・施工代理店を先に確定させ、残り全額を本部の取り分とする。
// これにより 決済手数料 + 取次店 + 施工代理店 + 本部 = 売上 が必ず一致する。
function splitOf(amount) {
  if (amount == null) return null;
  const fee = Math.round(amount * commissionSettings.paymentFeeRate);
  const base = amount - fee;
  const shop = Math.round(base * commissionSettings.shopRate);
  const contractor = Math.round(base * commissionSettings.contractorRate);
  return { amount, fee, base, shop, contractor, hq: base - shop - contractor };
}
// 複数案件の配分合計。案件ごとに計算してから足す（決済手数料は1件ごとに発生するため）
function splitTotal(orders) {
  return orders.reduce((t, o) => {
    const s = splitOf(o.amount);
    if (s) ["amount", "fee", "base", "shop", "contractor", "hq"].forEach(k => t[k] += s[k]);
    return t;
  }, { amount: 0, fee: 0, base: 0, shop: 0, contractor: 0, hq: 0 });
}
const contractorPayout = amount => { const s = splitOf(amount); return s && s.contractor; };
const shopPayout = amount => { const s = splitOf(amount); return s && s.shop; };

const PREFECTURES = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
  "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
  "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県",
  "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
  "鳥取県", "島根県", "岡山県", "広島県", "山口県",
  "徳島県", "香川県", "愛媛県", "高知県",
  "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
];

// 取次店（施工代理店が開拓・管理する / 中古車販売・パーツ店など）
let shops = [
  { id: 1, code: "SHOP-0001", name: "中古車センターつくば", contractorId: 2, type: "中古車販売", contact: "田村 隆", tel: "029-111-1111", region: "茨城県", status: "稼働中", bank: { bankName: "常陽銀行", branchName: "つくば支店", accountType: "普通", accountNumber: "1111111", accountHolder: "ﾁｭｳｺｼｬｾﾝﾀｰﾂｸﾊﾞ(ｶ" }, joined: "2026-03-01" },
  { id: 2, code: "SHOP-0002", name: "カーパーツ大宮", contractorId: 1, type: "パーツ販売", contact: "小林 誠", tel: "048-222-2222", region: "埼玉県", status: "稼働中", bank: { bankName: "埼玉りそな銀行", branchName: "大宮支店", accountType: "普通", accountNumber: "2222222", accountHolder: "ｶｰﾊﾟｰﾂｵｵﾐﾔ(ｶ" }, joined: "2026-03-10" },
  { id: 3, code: "SHOP-0003", name: "横浜オートガレージ", contractorId: 1, type: "中古車販売", contact: "中村 良太", tel: "045-333-3333", region: "神奈川県", status: "稼働中", bank: { bankName: "横浜銀行", branchName: "横浜支店", accountType: "普通", accountNumber: "3333333", accountHolder: "ﾖｺﾊﾏｵｰﾄｶﾞﾚｰｼﾞ(ｶ" }, joined: "2026-04-02" },

// 連番の採番。件数ではなく既存の最大番号から採る（途中の1件が取り消されても重複しない）。
// 本番ではDB側で採番する。
function nextSeqId(prefix, list) {
  const max = list.reduce((m, o) => {
    const n = parseInt(String(o.id).replace(prefix, ""), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + String(max + 1).padStart(4, "0");
}

// Date → "YYYY-MM-DD"（ローカル日付）。toISOString() は UTC になり日本では1日ずれるため必ずこちらを使う
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(dateStr, days) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + days); return fmtDate(d); }
// 祝日は簡易モックのため未対応（本番では祝日カレンダーAPI等と連携する想定）
const HOLIDAYS = ["2026-06-15"];
function addBusinessDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !HOLIDAYS.includes(fmtDate(d))) added++;
  }
  return fmtDate(d);
}
function flowHtml(status) {

}

function entityName() {
  if (session.role === "hq") return "本部 管理者";
  if (session.role === "shop") return shopById(session.entityId).name;
  return opById(session.entityId).name;
}

function buildUI() {
  const roleDef = ROLES.find(r => r.key === session.role);
  $("role-banner").innerHTML = `${roleDef.icon} ${roleDef.name}としてログイン中<b>${esc(entityName())}</b>`;
  const navs = NAVS[session.role];
  $("nav-area").innerHTML = navs.map((n, i) => `<div class="nav-item ${i === 0 ? "active" : ""}" data-page="${n.id}">${n.icon} ${n.label}</div>`).join("");
  $("main").innerHTML = navs.map((n, i) => `<section class="page ${i === 0 ? "active" : ""}" id="page-${n.id}"></section>`).join("");
  $("topbar-title").textContent = navs[0].label;
  document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      item.classList.add("active");
      $("page-" + item.dataset.page).classList.add("active");
      $("topbar-title").textContent = navs.find(n => n.id === item.dataset.page).label;
      closeSidebar(); // スマホでは選んだら閉じる
      window.scrollTo(0, 0);
    });
  });
  renderAll();
}

function renderAll() {
  if (session.role === "hq") { renderHqDash(); renderHqSo(); renderHqPo(); renderHqSales(); renderHqPayment(); renderHqInvoice(); renderHqOp(); renderHqShop(); renderHqContract(); renderHqCars(); }

}

// 都道府県が一致する施工代理店を「近い」とみなす簡易距離モック（本番では施工現場住所を緯度経度に変換して算出）
function mockDistance(customerPref, c) {
  if (c.prefs.includes(customerPref)) return c.id % 5;          // 同一都道府県内（0〜4km 相当）
  if (c.region && customerPref) return 30 + (c.id * 7) % 50;   // 他県
  return 999;
}
function openAssignModal(soId) {
  renderAssignList(soId, "");
}
function renderAssignList(soId, prefFilter) {
  const o = serviceOrders.find(x => x.id === soId);
  const allPrefs = [...new Set(contractors.flatMap(c => c.prefs))].sort();
  let list = contractors.filter(c => c.status === "稼働中");
  if (prefFilter) list = list.filter(c => c.prefs.includes(prefFilter));
  list = list.map(c => ({ c, dist: mockDistance(o.customerPref, c) })).sort((a, b) => a.dist - b.dist);
  openModal(`
    <h2>施工代理店の割り当て — ${o.id}</h2>

        </tbody>
      </table>

      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
    </div>`);

// 出荷できるのは、請求書を作成して「送付済み」（または入金済）にした注文だけ。
// 請求書を送る前に商品だけ届くと、施工代理店・本部の双方で照合が混乱するため。
// 判定は状態名ではなく「実際に送付した記録（sentAt）があるか」で行う。
// 入金だけ先に記録した場合でも、送付記録が無ければ出荷させない。
function canShip(o) {
  const inv = o.invoiceId ? invoiceById(o.invoiceId) : null;
  return !!inv && !!inv.sentAt;
}
function shipBlockReason(o) {
  const inv = o.invoiceId ? invoiceById(o.invoiceId) : null;
  if (!inv) return "請求書が未作成です。先に「請求書を作成」→ 送付済みにしてください";
  if (!inv.sentAt) return `請求書 ${inv.id} が未送付です。送付済みにすると出荷できます`;
  return "";
}
// 納品書番号（仮：DN-年月-連番）。正式ルールが決まり次第ここを差し替える
function nextDeliveryNoteNumber(dateStr) {
  const ym = (dateStr || TODAY).slice(0, 7).replace("-", "");
  const n = supplyOrders.filter(o => (o.deliveryNoteId || "").startsWith("DN-" + ym + "-")).length + 1;
  return `DN-${ym}-${String(n).padStart(3, "0")}`;
}
function shipPo(poId) {
  const o = supplyOrders.find(x => x.id === poId);
  if (!canShip(o)) { alert(shipBlockReason(o)); return; }
  const short = o.lines.filter(l => prodById(l.productId).stock < l.qty).map(l => { const p = prodById(l.productId); return `${p.name}（在庫 ${p.stock} ${p.unit}、注文 ${l.qty} ${p.unit}）`; });
  if (short.length && !confirm(`在庫が不足しています：${short.join("、")}。このまま出荷済にしますか？`)) return;
  o.status = "出荷済";
  o.shippedAt = TODAY;
  o.deliveryNoteId = nextDeliveryNoteNumber(TODAY); // 出荷と同時に納品書を自動作成
  o.lines.forEach(l => {
    const p = prodById(l.productId);
    p.stock = Math.max(0, p.stock - l.qty);
    stockLogs.unshift({ date: TODAY, productId: p.id, type: "出荷", qty: -l.qty, after: p.stock, note: `${o.id} ${esc(opById(o.contractorId).name)}` });
  });
  renderAll();
  openDeliveryNote(o.id);
}

function mockQrSvg(seed) {
  // モック用の擬似QRパターン（実際はQRライブラリで生成）
  let cells = "";
  let v = seed * 2654435761 % 4294967296;
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
    v = (v * 1103515245 + 12345) % 2147483648;
    const finder = (x < 7 && y < 7) || (x > 21 && y < 7) || (x < 7 && y > 21);
    if (finder) {
      const fx = x > 21 ? x - 22 : x, fy = y > 21 ? y - 22 : y;
      if (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    } else if (v % 100 < 45) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return cells;
}

// =====================================================
// 一覧の絞り込み・並べ替え（本部の各画面で共通）
// =====================================================
const tableState = {}; // 画面キー → { sortKey, sortDir, filters }
// ログイン・ログアウト時に全画面の絞り込みを初期化する。
// （別の取次店・施工代理店に切り替えたとき、前の店の絞り込みが残って「0件」になるのを防ぐ）
function clearAllTableState() { Object.keys(tableState).forEach(k => delete tableState[k]); }
function ts(key) { return tableState[key] = tableState[key] || { sortKey: null, sortDir: 1, filters: {} }; }
function setSort(key, col, render) { const s = ts(key); if (s.sortKey === col) s.sortDir *= -1; else { s.sortKey = col; s.sortDir = 1; } window[render](); }
function setFilter(key, name, value, render) { ts(key).filters[name] = value; window[render](); }
function clearFilters(key, render) { ts(key).filters = {}; ts(key).sortKey = null; window[render](); }
function thSort(key, col, label, render) {
  const s = ts(key);
  return `<th class="sortable" onclick="setSort('${key}','${col}','${render}')">${label}<span class="sort-arrow">${s.sortKey === col ? (s.sortDir === 1 ? "▲" : "▼") : "⇅"}</span></th>`;
}
// options は文字列か {value,label}
function filterSelect(key, name, label, options, render) {
  const v = ts(key).filters[name] || "";
  const opts = options.map(o => typeof o === "string" ? { value: o, label: o } : o);
  return `<label class="flt"><span>${label}</span><select onchange="setFilter('${key}','${name}',this.value,'${render}')"><option value="">すべて</option>${opts.map(o => `<option value="${o.value}" ${o.value === v ? "selected" : ""}>${o.label}</option>`).join("")}</select></label>`;
}
function filterSummary(key, render, shown, total) {
  return `<button class="btn btn-ghost btn-sm" onclick="clearFilters('${key}','${render}')">条件をクリア</button><span style="font-size:12px;color:var(--muted)">${shown} / ${total} 件</span>`;
}
// getters: { 列キー: 行 → 比較・絞り込みに使う値 }
function applyTable(key, rows, getters) {
  const s = ts(key);
  let out = rows.filter(r => Object.entries(s.filters).every(([n, v]) => !v || !getters[n] || String(getters[n](r)) === v));
  if (s.sortKey && getters[s.sortKey]) {
    const g = getters[s.sortKey];
    out = [...out].sort((a, b) => { const x = g(a), y = g(b); return (x > y ? 1 : x < y ? -1 : 0) * s.sortDir; });
  }
  return out;
}
function monthLabel(m) { return m ? m.replace("-", "年") + "月" : ""; }

// =====================================================
// 本部：売上管理・支払管理
// =====================================================
// 支払いは月初から月末までで締める。'YYYY-MM' を扱う。
function monthOf(dateStr) { return (dateStr || "").slice(0, 7); }
function availableMonths() {
  const set = new Set([
    ...serviceOrders.map(o => monthOf(o.date)),
    ...completedOnly(serviceOrders).map(completionMonthOf),
    ...supplyOrders.map(o => monthOf(o.date)),
  ].filter(Boolean));
  return [...set].sort().reverse();
}
let salesMonth;          // 売上管理で選択中の月（undefined = 未選択、null = 全期間）
let paymentMonth = null; // 支払管理で選択中の締め月

function ordersInMonth(list, month) { return month ? list.filter(o => monthOf(o.date) === month) : list; }
// キャンセル・返金の可能性があるため、施工代理店・取次店への支払は
// 「施工完了」となった案件だけを対象にする（新規受付〜施工日確定の段階では未確定の売上として扱う）
function completedOnly(list) { return list.filter(o => o.status === "施工完了"); }
function notCompletedOnly(list) { return list.filter(o => o.status !== "施工完了"); }
// 売上の確定と支払の締めは「施工完了日」の月で行う（受付日ではない）。
// 例：6月28日受付・7月3日完了の案件は、7月分の確定売上・支払になる。
function completionMonthOf(o) { return monthOf(o.completedAt || o.scheduled || o.date); }
function completedInMonth(month) {
  const done = completedOnly(serviceOrders);
  return month ? done.filter(o => completionMonthOf(o) === month) : done;
}
// 施工代理店・取次店の自分の画面用：月ごとの実績（確定＝施工完了日の月、未完了＝受付日の月）
// role は "contractor"（80%）または "shop"（10%）で、受取見込みの計算に使う
function monthlyBreakdown(list, role) {
  const byMonth = {};
  const row = m => (byMonth[m] = byMonth[m] || { month: m, done: [], pending: [] });
  completedOnly(list).forEach(o => row(completionMonthOf(o)).done.push(o));
  notCompletedOnly(list).forEach(o => row(monthOf(o.date)).pending.push(o));
  return Object.values(byMonth).sort((a, b) => b.month.localeCompare(a.month)).map(r => {
    const t = splitTotal(r.done);
    return { month: r.month, doneCount: r.done.length, doneAmount: t.amount, payout: role === "shop" ? t.shop : t.contractor,
             pendingCount: r.pending.length, pendingAmount: r.pending.reduce((s, o) => s + (o.amount || 0), 0) };
  });
}
function monthlyTableHtml(list, role) {
  const rows = monthlyBreakdown(list, role);
  return `
    <div class="card" style="padding:0;margin-bottom:14px">
      <div class="section-title" style="margin:14px 16px 6px">月別の実績</div>
      <table>
        <thead><tr><th>月</th><th>施工完了（確定）</th><th>受取見込み</th><th>施工中・未完了（参考）</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr><td><b>${r.month.replace("-", "年")}月</b></td><td>${r.doneCount} 件 / ${yen(r.doneAmount)}</td><td><b>${yen(r.payout)}</b></td><td style="color:var(--muted)">${r.pendingCount} 件 / ${yen(r.pendingAmount)}</td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--muted)">実績はまだありません</td></tr>`}
        </tbody>
      </table>
      <div style="font-size:11px;color:var(--muted);padding:8px 16px 12px">※ 確定分は施工完了日の月、未完了分は受付日の月で集計しています。お支払いは施工完了の月を月末締めの翌月払いです。</div>
    </div>`;
}

function renderHqSales() {
  const el = $("page-hq-sales"); if (!el) return;
  const months = availableMonths();
  if (salesMonth === undefined && months.length) salesMonth = months[0]; // 初回だけ最新月を既定にする（全期間=null は尊重する）
  const so = ordersInMonth(serviceOrders, salesMonth);
  const soDone = completedInMonth(salesMonth);   // 確定売上は「施工完了日」の月で計上
  const soPending = notCompletedOnly(so);        // 未完了は「受付日」の月で参考表示
  const po = ordersInMonth(supplyOrders, salesMonth);
  const doneTotal = soDone.reduce((s, o) => s + (o.amount || 0), 0);
  const pendingTotal = soPending.reduce((s, o) => s + (o.amount || 0), 0);
  const poTotal = po.reduce((s, o) => s + (poAmount(o) || 0), 0);
  // 消耗品は未出荷分も売上に含める（本部方針）。ただし未出荷がいくらあるかは分けて見せる
  const poShipped = po.filter(o => o.status === "出荷済");
  const poUnshipped = po.filter(o => o.status !== "出荷済");
  const poShippedTotal = poShipped.reduce((s, o) => s + (poAmount(o) || 0), 0);
  const poUnshippedTotal = poUnshipped.reduce((s, o) => s + (poAmount(o) || 0), 0);

  // 施工代理店ごと：施工完了分の売上（確定）と、未完了分（参考）、消耗品の購入額
  const opRows = contractors.map(c => {
    const done = soDone.filter(o => o.contractorId === c.id);

// 月次の支払明細（施工代理店・取次店ごとの配分額）を計算する。
// キャンセル・返金の可能性があるため、支払の対象は「施工完了」の案件のみ。
// 配分は案件ごとに計算してから合算する（決済手数料が1件ごとに発生するため）
function payoutRows(month) {
  const so = completedInMonth(month);
  const rows = [];
  contractors.forEach(c => {
    const jobs = so.filter(o => o.contractorId === c.id);
    const t = splitTotal(jobs);
    if (t.amount) rows.push({ type: "施工代理店", name: c.name, bank: c.bank, count: jobs.length, amount: t.amount, payout: t.contractor });
  });
  shops.forEach(s => {
    const orders = so.filter(o => o.shopId === s.id);
    const t = splitTotal(orders);
    if (t.amount) rows.push({ type: "取次店", name: s.name, bank: s.bank, count: orders.length, amount: t.amount, payout: t.shop });
  });
  return rows;
}

// 振込CSVの出力。関西みらい銀行の正式フォーマットを受領したら、この項目定義を差し替える。
const TRANSFER_CSV_COLUMNS = ["支払区分", "支払先名", "銀行名", "支店名", "預金種目", "口座番号", "口座名義", "振込金額"];
function downloadTransferCsv() {
  const rows = payoutRows(paymentMonth);
  if (!rows.length) { alert("対象月の支払データがありません"); return; }
  // 値にカンマ・引用符・改行が含まれても列がずれないよう CSV の引用規則で囲む
  const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [TRANSFER_CSV_COLUMNS.map(q).join(",")];
  rows.forEach(r => {
    const b = r.bank || {};
    lines.push([r.type, r.name, b.bankName || "", b.branchName || "", b.accountType || "", b.accountNumber || "", b.accountHolder || "", r.payout].map(q).join(","));
  });
  // Excelで開いたときに文字化けしないようBOMを付ける
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `振込データ_${paymentMonth}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function payeeName(inv) { const e = inv.payeeType === "取次店" ? shopById(inv.payeeId) : opById(inv.payeeId); return e ? e.name : "（未選択）"; }
function unitPriceFor(product, payeeType) { return payeeType === "取次店" ? (product.shopPrice || product.price) : product.price; }
function invoiceSubtotal(inv) { return inv.lines.reduce((s, l) => s + (Number(l.unitPrice) || 0) * (Number(l.qty) || 0), 0); }
function invoiceTotal(inv) { return invoiceSubtotal(inv) + (Number(inv.shipping) || 0); }
function invoiceTax(inv) { const t = invoiceTotal(inv); return t - Math.round(t / (1 + TAX_RATE)); }

        ${filterSelect(K, "payee", "宛先", payees, R)}

              <tr>

                <td><b>${yen(invoiceTotal(i))}</b></td>
                <td>${invBadge(i.status)}${i.sentAt ? `<br><span style="font-size:11px;color:var(--muted)">${i.sentAt} 送付</span>` : ""}</td>

                  ${i.status === "送付済み" ? `<button class="btn btn-success btn-sm" onclick="setInvoiceStatus('${i.id}','入金済')">入金済にする</button>` : ""}
                </td>
              </tr>`).join("") || `<tr><td colspan="9" style="color:var(--muted)">条件に合う請求書がありません</td></tr>`}

}
function setInvoiceStatus(id, status) {
  const inv = invoiceById(id);
  if (status === "送付済み") {
    if (inv.sentAt && !confirm(`この請求書は ${inv.sentAt} に送付済みです。もう一度送付済みとして記録しますか？`)) return;
    inv.sentAt = TODAY; // 二重送付防止のため送付日を残す（本番では送付時刻）
  }
  inv.status = status;
  if (status === "入金済") {
    inv.orderIds.forEach(oid => { const o = supplyOrders.find(x => x.id === oid); if (o) o.paid = "入金済"; });
    if (inv.contractId) { const c = contracts.find(x => x.id === inv.contractId); if (c) c.feePaid = "入金済"; }
  }
  renderAll();
}
// 消耗品注文の入金を直接記録する（請求書があればその状態も入金済にそろえる）
function markPoPaid(poId) {
  const o = supplyOrders.find(x => x.id === poId);
  if (!confirm(`${o.id}（${esc(opById(o.contractorId).name)}・${yen(poAmount(o))}）を入金済にしますか？`)) return;
  o.paid = "入金済";
  if (o.invoiceId) {
    const inv = invoiceById(o.invoiceId);
    // 未送付の請求書は「入金済」にしない（送付記録が無いまま進めると出荷制限をすり抜けるため）
    if (inv && inv.sentAt) inv.status = "入金済";
    else if (inv) alert(`注文の入金を記録しました。ただし請求書 ${inv.id} は未送付のため、請求書の状態は「作成済み」のままです。先に送付済みにしてください。`);
  }
  renderAll();
}
// 契約書管理から加盟金の請求書を作成する（宛先は契約先の施工代理店）
function createFeeInvoice(contractId) {
  const c = contracts.find(x => x.id === contractId);
  if (c.feeInvoiceId) { openInvoicePreview(c.feeInvoiceId); return; }
  const payee = c.layer === "施工代理店" ? opById(c.entityId) : null;
  if (!payee) { alert("加盟金の請求書は施工代理店の契約にのみ作成できます"); return; }
  const inv = {
    id: nextInvoiceNumber(TODAY), kind: "加盟金", date: TODAY, dueDate: addDays(TODAY, 30),
    payeeType: "施工代理店", payeeId: payee.id,
    lines: [{ productId: null, name: "加盟金（施工代理店契約）", qty: 1, unitPrice: c.feeAmount }],
    shipping: 0, note: `施工代理店契約（${esc(c.file)}）に基づく加盟金`, status: "作成済み", sentAt: null, orderIds: [], contractId: c.id,
  };
  invoices.unshift(inv);
  c.feeInvoiceId = inv.id;
  openInvoiceEditor(inv.id);
}
// 加盟金の入金を直接記録する（請求書があればその状態も入金済にそろえる）
function markContractPaid(contractId) {
  const c = contracts.find(x => x.id === contractId);
  if (!confirm(`${esc(c.entity)} の加盟金 ${yen(c.feeAmount)} を入金済にしますか？`)) return;
  c.feePaid = "入金済";
  if (c.feeInvoiceId) { const inv = invoiceById(c.feeInvoiceId); if (inv) inv.status = "入金済"; }
  renderAll();
}

// ---------- 編集（数字・物品・数量はすべて修正できる。物品はマスタからプルダウンで選ぶ） ----------
function openInvoiceEditor(id) {
  const inv = invoiceById(id);
  // 送付済み・入金済の請求書は内容を変えない（相手に渡した内容と食い違わないようにする）
  if (inv.status !== "作成済み") { openInvoicePreview(id); return; }
  editingInvoice = JSON.parse(JSON.stringify(inv)); // 保存するまで元データに触らない
  renderInvoiceEditor();
}
function renderInvoiceEditor() {
  const inv = editingInvoice;
  const entities = inv.payeeType === "取次店" ? shops : contractors;
  openModal(`
    <h2>請求書の編集 — ${inv.id} ${invBadge(inv.status)}</h2>
    <div class="form-grid">
      <div class="form-group"><label>宛先の区分</label>
        <select onchange="invSetPayeeType(this.value)"><option ${inv.payeeType === "施工代理店" ? "selected" : ""}>施工代理店</option><option ${inv.payeeType === "取次店" ? "selected" : ""}>取次店</option></select></div>
      <div class="form-group"><label>宛先</label>
        <select onchange="editingInvoice.payeeId = parseInt(this.value)">${entities.map(e => `<option value="${e.id}" ${e.id === inv.payeeId ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></div>
      <div class="form-group"><label>発行日</label><input type="date" value="${inv.date}" onchange="editingInvoice.date = this.value"></div>
      <div class="form-group"><label>支払期限</label><input type="date" value="${inv.dueDate}" onchange="editingInvoice.dueDate = this.value"></div>
    </div>
    <div class="section-title">${inv.kind === "加盟金" ? "明細（品名・数量・単価は修正可）" : "明細（商品はプルダウンから選択・数量と単価は修正可）"}</div>
    <div class="card inv-lines" style="padding:0;margin-bottom:10px">
      <table>
        <thead><tr><th>商品</th><th>数量</th><th>単価（税込）</th><th>金額</th><th></th></tr></thead>
        <tbody>
          ${inv.lines.map((l, i) => `
            <tr>
              <td>${l.productId == null
                ? `<input type="text" value="${esc(l.name)}" oninput="editingInvoice.lines[${i}].name = this.value" placeholder="品名（例：加盟金）">`
                : `<select onchange="invLineProduct(${i}, parseInt(this.value))">${products.map(p => `<option value="${p.id}" ${p.id === l.productId ? "selected" : ""}>${p.name}${p.published ? "" : "（非公開）"}</option>`).join("")}</select>`}</td>
              <td><input type="number" min="1" value="${l.qty}" oninput="invLineField(${i}, 'qty', this.value)"></td>
              <td><input type="number" min="0" step="1" value="${l.unitPrice}" oninput="invLineField(${i}, 'unitPrice', this.value)"></td>
              <td class="inv-line-amount" id="inv-line-${i}">${yen((Number(l.unitPrice) || 0) * (Number(l.qty) || 0))}</td>
              <td><button class="btn btn-ghost btn-sm" onclick="invRemoveLine(${i})">削除</button></td>
            </tr>`).join("") || `<tr><td colspan="5" style="color:var(--muted)">明細がありません。「明細を追加」から商品を選んでください</td></tr>`}
        </tbody>
      </table>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" onclick="invAddLine()">＋ 明細を追加</button>
      <button class="btn btn-ghost btn-sm" onclick="invAutoShipping()">送料を自動計算（${yen(SHIPPING.freeThreshold)}以上無料）</button>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>送料（税込・修正可）</label><input type="number" min="0" id="inv-shipping" value="${inv.shipping}" oninput="editingInvoice.shipping = Number(this.value) || 0; invRefreshTotals()"></div>
      <div class="form-group full"><label>備考</label><textarea rows="2" oninput="editingInvoice.note = this.value">${inv.note || ""}</textarea></div>
    </div>
    <div id="inv-totals" class="price-box"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-ghost" onclick="saveInvoice(); openInvoicePreview('${inv.id}')">保存してプレビュー</button>
      <button class="btn btn-primary" onclick="saveInvoice(); closeModal(); renderAll()">保存</button>
    </div>`);
  invRefreshTotals();
}
function invRefreshTotals() {
  const inv = editingInvoice; if (!inv) return;
  inv.lines.forEach((l, i) => { const c = $("inv-line-" + i); if (c) c.textContent = yen((Number(l.unitPrice) || 0) * (Number(l.qty) || 0)); });
  $("inv-totals").innerHTML = `
    <div class="price-row"><span>商品代 小計</span><span>${yen(invoiceSubtotal(inv))}</span></div>
    <div class="price-row"><span>送料</span><span>${yen(Number(inv.shipping) || 0)}</span></div>
    <div class="price-row total"><span>請求金額（税込）</span><span>${yen(invoiceTotal(inv))}</span></div>
    <div class="price-row" style="color:var(--muted);font-size:12px"><span>（内 消費税 ${(TAX_RATE * 100).toFixed(0)}%）</span><span>${yen(invoiceTax(inv))}</span></div>`;
}
function invSetPayeeType(t) {
  editingInvoice.payeeType = t;
  editingInvoice.payeeId = (t === "取次店" ? shops : contractors)[0].id;
  editingInvoice.lines.forEach(l => { if (l.productId != null) l.unitPrice = unitPriceFor(prodById(l.productId), t); }); // 取次店向け価格に切り替え（加盟金などの自由明細は据え置き）
  renderInvoiceEditor();
}
function invLineProduct(i, productId) {
  const l = editingInvoice.lines[i];
  l.productId = productId; l.unitPrice = unitPriceFor(prodById(productId), editingInvoice.payeeType);
  renderInvoiceEditor();
}
function invLineField(i, field, value) { editingInvoice.lines[i][field] = Number(value) || 0; invRefreshTotals(); }
function invAddLine() {
  if (editingInvoice.kind === "加盟金") { editingInvoice.lines.push({ productId: null, name: "", qty: 1, unitPrice: 0 }); renderInvoiceEditor(); return; }
  const p = orderableProducts()[0] || products[0];
  editingInvoice.lines.push({ productId: p.id, qty: 1, unitPrice: unitPriceFor(p, editingInvoice.payeeType) });
  renderInvoiceEditor();
}
function invRemoveLine(i) { editingInvoice.lines.splice(i, 1); renderInvoiceEditor(); }
function invAutoShipping() { editingInvoice.shipping = shippingFee(invoiceSubtotal(editingInvoice)); $("inv-shipping").value = editingInvoice.shipping; invRefreshTotals(); }
function saveInvoice() {
  const idx = invoices.findIndex(i => i.id === editingInvoice.id);
  invoices[idx] = JSON.parse(JSON.stringify(editingInvoice));
}

function addCarFromForm() {
  const maker = $("cd-maker").value.trim(), model = $("cd-model").value.trim();

function onCarInput() {
  const r = judgeCarClass($("cf-car").value);
  const el = $("cf-car-judge");
  if (!$("cf-car").value.trim()) {
    el.innerHTML = "車種を入力すると区分を自動判定します";
    $("cf-class").value = "";
  } else if (r) {
    el.innerHTML = `✅ <b style="color:var(--success)">${r.carClass}</b> と判定（${r.entry.maker} ${r.entry.model}）${r.entry.note ? `<br><span style="color:var(--warning)">⚠ ${r.entry.note}</span>` : ""}`;
    $("cf-class").value = r.carClass;
  } else {
    el.innerHTML = `<span style="color:var(--warning)">⚠ 辞書に見つかりませんでした。区分を手動で選択してください</span>`;
    $("cf-class").value = "";
  }
  updatePriceSummary();
}
function currentOrderAmount() {
  const cls = $("cf-class").value;
  const base = cls ? CAR_CLASS_PRICE[cls] : null;
  const yani = $("cf-yani").checked;
  return { cls, base, yani, total: base == null ? null : base + (yani ? YANI_OPTION_PRICE : 0) };
}
function updatePriceSummary() {
  const a = currentOrderAmount();
  $("cf-price").innerHTML = a.base == null
    ? `<div style="color:var(--muted)">車両区分を選ぶと金額が表示されます</div>`
    : `<div class="price-row"><span>施工料金（${a.cls}）</span><span>${yen(a.base)}</span></div>
       ${a.yani ? `<div class="price-row"><span>やにとりオプション</span><span>${yen(YANI_OPTION_PRICE)}</span></div>` : ""}
       <div class="price-row total"><span>お支払い合計（税込）</span><span>${yen(a.total)}</span></div>`;
}
function goToPayment() {
  const name = $("cf-name").value.trim(), tel = $("cf-tel").value.trim();
  if (!name || !tel) { alert("お名前と電話番号を入力してください"); return; }
  if (!$("cf-pref").value || !$("cf-city").value.trim()) { alert("施工場所の住所（都道府県・市区町村）を入力してください"); return; }
  if (!$("cf-car").value.trim()) { alert("車種を入力してください"); return; }
  const a = currentOrderAmount();
  if (a.base == null) { alert("車両区分を選択してください"); return; }
  const minDate = addBusinessDays(TODAY, 3);
  if ($("cf-date").value < minDate) { alert("施工希望日は申込日から3営業日後（土日祝を除く）以降を選択してください"); return; }
  openPaymentModal();
}

function renderOpJobs() {
  const el = $("page-op-jobs"); if (!el) return;
  const list = serviceOrders.filter(o => o.contractorId === session.entityId);
  const pending = list.filter(o => o.status === "施工店確認中");
  // 上部の集計は「当月」のみ（確定分は施工完了日の月、未完了分は受付日の月）。過去分は下の「月別の実績」で見る
  const thisMonth = monthOf(TODAY);
  const doneList = completedOnly(list).filter(o => completionMonthOf(o) === thisMonth);
  const notDoneList = notCompletedOnly(list).filter(o => monthOf(o.date) === thisMonth);
  const tDone = splitTotal(doneList);
  const notDoneTotal = notDoneList.reduce((s, o) => s + (o.amount || 0), 0);
  const byShop = {};
  [...doneList, ...notDoneList].forEach(o => {
    const shop = shopById(o.shopId);
    if (!byShop[shop.id]) byShop[shop.id] = { shop, done: [], notDone: [] };
    (o.status === "施工完了" ? byShop[shop.id].done : byShop[shop.id].notDone).push(o);
  });
  const shopRows = Object.values(byShop)
    // splitTotal の戻り値にも取次店配分の `shop`（数値）があるため、取次店オブジェクトは別名で持つ
    .map(r => ({ ...splitTotal(r.done), shopEntity: r.shop, count: r.done.length, notDoneCount: r.notDone.length, notDoneAmount: r.notDone.reduce((s, o) => s + (o.amount || 0), 0) }))
    .sort((a, b) => b.amount - a.amount);

  el.innerHTML = `
    <div class="page-title">施工案件</div>
    <div class="page-desc">本部から割り当てられた案件です。対応可否の回答と施工完了の報告を行います</div>

    <div class="alert alert-info" style="font-size:12px">💡 キャンセル・返金の可能性があるため、受取見込み額は<b>「施工完了」となった案件のみ</b>で計算しています。施工中・確認中の案件は完了後に反映されます。</div>

      <div class="card"><div class="stat-label">${monthLabel(thisMonth)} 受取見込み額</div><div class="stat-value" style="color:var(--primary-dark)">${yen(tDone.contractor)}</div><div class="stat-sub">決済手数料 ${yen(tDone.fee)} を引いた額の ${(commissionSettings.contractorRate * 100).toFixed(0)}%${commissionSettings.paymentFeeConfirmed ? "" : "<br>※ 手数料率は決済代行会社が決まるまで仮の値です"}</div></div>
      <div class="card" style="grid-column:span 2">
        <div class="stat-label" style="margin-bottom:8px">${monthLabel(thisMonth)} 取次店ごとの内訳（参考）</div>
        <table style="font-size:12px"><thead><tr><th>取次店</th><th>施工完了</th><th>受取見込み</th><th>施工中・未完了</th></tr></thead><tbody>
          ${shopRows.map(r => `<tr><td>${esc(r.shopEntity.name)}</td><td>${r.count}件 / ${yen(r.amount)}</td><td>${yen(r.contractor)}</td><td style="color:var(--muted)">${r.notDoneCount}件 / ${yen(r.notDoneAmount)}</td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--muted)">${monthLabel(thisMonth)}の案件はありません</td></tr>`}

    ${(() => {

function opJobAction(o) {
  if (o.status === "施工店確認中") return `<button class="btn btn-success btn-sm" onclick="acceptJob('${o.id}')">対応できる</button> <button class="btn btn-ghost btn-sm" onclick="declineJob('${o.id}')">対応不可</button>`;
  if (o.status === "施工日確定") return `<button class="btn btn-primary btn-sm" onclick="openValuablesModal('${o.id}')">施工前確認へ進む</button>`;
  if (o.status === "施工前確認済み") return `<button class="btn btn-primary btn-sm" onclick="completeJob('${o.id}')">施工完了を報告</button>`;
  return "—";
}
function acceptJob(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工日確定";
  o.scheduled = o.desire;
  renderAll();
}
function declineJob(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "新規受付";
  o.contractorId = null;
  o.scheduled = null; // 施工日も白紙に戻す（別の施工代理店が改めて日程を確定する）
  renderAll();
  alert("対応不可として本部に戻しました。本部が別の施工代理店を割り当てます。");
}

    <h2>施工前確認 — ${o.id}</h2>
    <div class="alert alert-warn">📢 ご確認をいただきましたら、ご署名をお願いします。</div>
    <div class="card" style="background:#f8fafc;margin-bottom:14px">
      ・車内に貴重品（財布・スマートフォン・貴金属類など）が残っていないことを確認しました。<br>
      ・車体の傷について、施工前に確認しました。
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px">
      <input type="checkbox" id="valuables-check"> 上記内容を確認しました
    </label>
    <div class="form-group">
      <label>お客さまのご署名（画面に指またはタッチペンでお名前をご記入ください）</label>
      <canvas id="sig-pad" width="560" height="160" style="border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:560px;display:block;cursor:crosshair"></canvas>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;align-self:flex-start" onclick="clearSignature()">✎ 署名をやり直す</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitValuablesCheck('${o.id}')">この内容で本部に送信</button>
    </div>`);
  setupSignaturePad();
}
function setupSignaturePad() {
  const canvas = $("sig-pad");
  sigCtx = canvas.getContext("2d");
  sigCtx.lineWidth = 2.5; sigCtx.lineCap = "round"; sigCtx.strokeStyle = "#2c3e50";
  sigDrawing = false; sigHasDrawn = false;
  const posOf = e => {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
  };
  const start = e => { sigDrawing = true; sigHasDrawn = true; const p = posOf(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = e => { if (!sigDrawing) return; const p = posOf(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = () => { sigDrawing = false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
}
function clearSignature() {
  if (sigCtx) sigCtx.clearRect(0, 0, $("sig-pad").width, $("sig-pad").height);
  sigHasDrawn = false;
}
function submitValuablesCheck(soId) {
  if (!$("valuables-check").checked) { alert("チェックボックスにチェックを入れてください"); return; }
  if (!sigHasDrawn) { alert("お客さまのご署名をご記入ください"); return; }
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工前確認済み";
  o.valuablesSignatureData = $("sig-pad").toDataURL("image/png");
  o.valuablesSignedAt = TODAY; // モックのため申込日を代用。本番では送信時刻を記録
  closeModal(); renderAll();
}
function completeJob(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工完了";
  o.completedAt = TODAY; // 売上の確定・支払の締めはこの日付の月で行う（本番では実際の完了報告日時）
  renderAll();
}

function renderOpPo() {
  const el = $("page-op-po"); if (!el) return;
  const list = supplyOrders.filter(o => o.contractorId === session.entityId);
  el.innerHTML = `
    <div class="page-title">消耗品注文</div>
    <div class="page-desc">除菌消臭剤などの消耗品を本部に注文します（表示金額はすべて税込）</div>
    <div class="alert alert-shipping">🚚 ${yen(SHIPPING.freeThreshold)}以上のご注文は送料無料<small>${yen(SHIPPING.freeThreshold)}未満のご注文には送料 ${yen(SHIPPING.fee)} がかかります（金額はすべて税込）</small></div>
    <div class="toolbar"><div></div><button class="btn btn-primary" onclick="openPoModal()">＋ 消耗品を注文</button></div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>注文番号</th><th>注文日</th><th>商品</th><th>数量</th><th>商品代</th><th>送料</th><th>合計</th><th>入金</th><th>状況</th></tr></thead>
        <tbody>
          ${list.map(o => `<tr><td><b>${o.id}</b></td><td>${o.date}</td><td style="font-size:12px">${poLinesHtml(o)}</td><td>${poQtyTotal(o)}</td><td>${yen(poSubtotal(o))}</td><td>${poSubtotal(o) == null ? "—" : (shippingFee(poSubtotal(o)) === 0 ? "無料" : yen(shippingFee(poSubtotal(o))))}</td><td><b>${yen(poAmount(o))}</b></td><td>${paidBadge(o.paid)}</td><td>${opPoBadge(o.status)}${o.deliveryNoteId ? `<br><span class="link" style="font-size:11px" onclick="openDeliveryNote('${o.id}')">📦 納品書 ${o.deliveryNoteId}</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="9" style="color:var(--muted)">注文履歴はありません</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function openPoModal() {
  openModal(`
    <h2>消耗品を注文</h2>
    <div class="alert alert-info" style="font-size:12px">複数の商品をまとめて1回で注文できます。送料は<b>注文全体の商品代の合計</b>で判定します（${yen(SHIPPING.freeThreshold)}以上で無料）。</div>
    <div class="card" style="padding:0;margin-bottom:10px">
      <table>
        <thead><tr><th>商品</th><th>単価（税込）</th><th style="width:110px">数量</th><th>金額</th></tr></thead>
        <tbody>
          ${orderableProducts().map(p => `
            <tr>
              <td>${p.name}</td><td>${yen(p.price)} / ${p.unit}</td>
              <td><input type="number" class="po-qty" data-product="${p.id}" value="0" min="0" oninput="updatePoSummary()"></td>
              <td id="po-line-${p.id}">${yen(0)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div id="po-summary" class="price-box"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="savePo()">注文する</button>
    </div>`);
  updatePoSummary();
}
// 入力中の明細（数量 0 は除く）
function poFormLines() {
  return [...document.querySelectorAll(".po-qty")].map(i => ({ productId: parseInt(i.dataset.product), qty: parseInt(i.value) || 0 })).filter(l => l.qty > 0);
}
function updatePoSummary() {
  document.querySelectorAll(".po-qty").forEach(i => { const p = prodById(parseInt(i.dataset.product)); $("po-line-" + p.id).textContent = yen(p.price * (parseInt(i.value) || 0)); });
  const lines = poFormLines();
  const sub = lines.reduce((s, l) => s + prodById(l.productId).price * l.qty, 0);
  const ship = shippingFee(sub);
  const remain = SHIPPING.freeThreshold - sub;
  $("po-summary").innerHTML = `
    ${lines.map(l => { const p = prodById(l.productId); return `<div class="price-row"><span>${p.name} × ${l.qty} ${p.unit}</span><span>${yen(p.price * l.qty)}</span></div>`; }).join("") || `<div class="price-row" style="color:var(--muted)"><span>数量を入力してください</span><span></span></div>`}
    <div class="price-row"><span>商品代 小計</span><span>${yen(sub)}</span></div>
    <div class="price-row"><span>送料</span><span>${ship === 0 && sub > 0 ? `無料（${yen(SHIPPING.freeThreshold)}以上）` : yen(ship)}${ship > 0 ? `<br><small style="color:var(--muted)">あと ${yen(remain)} で送料無料</small>` : ""}</span></div>
    <div class="price-row total"><span>お支払い合計（税込）</span><span>${yen(sub + ship)}</span></div>`;
}
function savePo() {
  const lines = poFormLines();
  if (!lines.length) { alert("数量を1つ以上入力してください"); return; }
  supplyOrders.unshift({
    id: nextSeqId("PO-", supplyOrders), date: TODAY, contractorId: session.entityId,
    lines, status: "受注", paid: "未入金",
  });
  closeModal(); renderAll();
}

// モーダル共通

function openModal(html) { $("modal-content").innerHTML = html; $("modal-bg").classList.add("open"); }
function closeModal() { $("modal-bg").classList.remove("open"); editingInvoice = null; }
$("modal-bg").addEventListener("click", e => { if (e.target === $("modal-bg")) closeModal(); });

// 初期表示
renderLogin();
