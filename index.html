<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除菌消臭 事業管理システム（モック v2）</title>
<style>
  :root {
    --primary: #1a6fb0;
    --primary-dark: #135a91;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #2c3e50;
    --muted: #7f8c9b;
    --border: #e3e8ee;
    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;
    --purple: #8e44ad;
    --sidebar-w: 230px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ===== ログイン画面 ===== */
  #login-screen {
    position: fixed; inset: 0; background: linear-gradient(135deg, #20304a, #1a6fb0);
    display: flex; align-items: center; justify-content: center; z-index: 500;
  }
  .login-box { background: #fff; border-radius: 14px; padding: 36px 40px; width: 420px; max-width: 92vw; }
  .login-box h1 { font-size: 18px; text-align: center; }
  .login-box .sub { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 24px; }
  .role-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px;
    text-align: left; transition: all .15s;
  }
  .role-btn:hover { border-color: var(--primary); background: #f2f8fd; }
  .role-btn .icon { font-size: 22px; }
  .role-btn b { display: block; }
  .role-btn small { color: var(--muted); font-size: 11px; }
  .login-select { margin-top: 4px; margin-bottom: 14px; }
  .login-select select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

  /* ===== レイアウト ===== */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
    background: #20304a; color: #fff; padding: 16px 0; overflow-y: auto; display: flex; flex-direction: column;
  }
  .sidebar h1 { font-size: 14px; padding: 8px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.15); }
  .sidebar h1 small { display: block; font-size: 10px; color: #9db4d0; font-weight: normal; margin-top: 4px; }
  .role-banner { padding: 10px 18px; font-size: 11px; background: rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.1); }
  .role-banner b { display: block; font-size: 13px; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; cursor: pointer; color: #c5d3e6; transition: background .15s; font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,.08); }
  .nav-item.active { background: var(--primary); color: #fff; }
  .logout { margin-top: auto; padding: 14px 18px; color: #9db4d0; cursor: pointer; font-size: 12px; border-top: 1px solid rgba(255,255,255,.1); }
  .logout:hover { color: #fff; }
  .main { margin-left: var(--sidebar-w); padding: 24px 28px; }
  /* スマホ用の上部バー（狭い画面でだけ表示し、サイドバーを開閉する） */
  .topbar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #20304a; color: #fff; align-items: center; gap: 12px; padding: 0 14px; z-index: 60; }
  .topbar .menu-btn { background: none; border: none; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 6px; }
  .topbar .title { font-size: 13px; font-weight: bold; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,35,.5); z-index: 55; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 20px; margin-bottom: 4px; }
  .page-desc { color: var(--muted); margin-bottom: 20px; font-size: 13px; }

  /* ===== 部品 ===== */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .card:has(table) { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 25px; font-weight: bold; margin-top: 6px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  .clickable { cursor: pointer; }
  .link { color: var(--primary); cursor: pointer; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .b-blue { background: #eaf2fb; color: var(--primary); }
  .b-green { background: #e8f8ef; color: var(--success); }
  .b-orange { background: #fef5e7; color: var(--warning); }
  .b-red { background: #fdecea; color: var(--danger); }
  .b-purple { background: #f0eafb; color: var(--purple); }
  .b-gray { background: #eef1f5; color: var(--muted); }

  .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,35,.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; padding: 24px 28px; }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: bold; }
  .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 16px; }
  .detail-item { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .detail-item .k { font-size: 11px; color: var(--muted); }
  .detail-item .v { font-size: 14px; margin-top: 2px; }
  .section-title { font-size: 14px; font-weight: bold; margin: 18px 0 10px; padding-left: 8px; border-left: 3px solid var(--primary); }

  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .alert-warn { background: #fef5e7; color: #b9770e; }
  .alert-danger { background: #fdecea; color: #c0392b; }
  .alert-info { background: #eaf2fb; color: var(--primary-dark); }

  .flow-steps { display: flex; gap: 0; margin: 8px 0 18px; flex-wrap: wrap; }
  .flow-step { padding: 7px 22px 7px 28px; background: #eef1f5; color: var(--muted); font-size: 12px; font-weight: bold; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
  .flow-step.done { background: var(--primary); color: #fff; }

  .proto-note { font-size: 11px; color: #9db4d0; padding: 12px 18px; }

  /* ===== 注文フォーム（お客さま向け） ===== */
  .customer-form-wrap { max-width: 520px; margin: 0 auto; }
  .qr-banner { background: #fff; border: 2px dashed var(--primary); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 13px; }
  .qr-banner b { color: var(--primary); }
  .price-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-size: 13px; }
  .price-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .price-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: bold; font-size: 15px; color: var(--primary-dark); }
  .two-col { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }

  /* ===== 請求書（プレビュー・印刷） ===== */
  .invoice-doc { background: #fff; color: #222; padding: 28px 32px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .invoice-doc h1 { font-size: 22px; letter-spacing: .3em; text-align: center; margin: 0 0 18px; }
  .invoice-doc .inv-head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
  .invoice-doc .inv-to { font-size: 16px; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 4px; min-width: 240px; }
  .invoice-doc .inv-meta { font-size: 12px; text-align: right; }
  .invoice-doc .inv-total { font-size: 18px; font-weight: bold; margin: 12px 0 16px; padding: 10px 14px; border: 2px solid #222; display: inline-block; }
  .invoice-doc table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .invoice-doc th, .invoice-doc td { border: 1px solid #999; padding: 6px 10px; font-size: 12.5px; color: #222; }
  .invoice-doc th { background: #f0f0f0; text-align: center; }
  .invoice-doc td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .invoice-doc .inv-issuer { font-size: 12px; margin-top: 16px; }
  .invoice-doc .inv-note { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
  .modal:has(.inv-lines), .modal:has(.invoice-doc) { max-width: 860px; }
  .inv-lines input, .inv-lines select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .inv-lines input[type=number] { width: 84px; text-align: right; }
  @media print {
    body * { visibility: hidden; }
    .invoice-doc, .invoice-doc * { visibility: visible; }
    .invoice-doc { position: absolute; left: 0; top: 0; width: 100%; border: none; border-radius: 0; }
    .modal-bg { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 0; }
    .modal { max-width: none; box-shadow: none; padding: 0; }
  }

  /* ===== スマホ・タブレット（狭い画面） ===== */
  @media (max-width: 820px) {
    /* サイドバーは通常隠しておき、メニューボタンで引き出す */
    .sidebar { transform: translateX(-100%); transition: transform .22s ease; z-index: 56; width: 250px; padding-top: 60px; }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 30px rgba(0,0,0,.35); }
    .sidebar-backdrop.open { display: block; }
    .topbar { display: flex; }
    .main { margin-left: 0; padding: 68px 14px 32px; }

    .page-title { font-size: 18px; }
    .page-desc { font-size: 12px; margin-bottom: 16px; }
    /* 統計カードは2列、極端に狭ければ1列 */
    .cards-row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .card { padding: 14px 14px; }
    .stat-value { font-size: 21px; }
    /* 入力フォームは1列に落とす（2列だと潰れて読めない） */
    .form-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    /* モーダルは画面いっぱいに近づけ、余白を詰める */
    .modal-bg { padding: 16px 10px; }
    .modal { padding: 18px 16px; }
    .modal h2 { font-size: 16px; }
    /* ツールバーのボタンは折り返して全幅に */
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .btn { width: 100%; }
    /* 一覧テーブルは横スクロールで見る。詰まりすぎないよう最低幅を確保 */
    .card:has(table) table { min-width: 560px; }
    .card:has(table) { padding: 0; }
    .flow-steps { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .flow-step { flex: 0 0 auto; }
  }
</style>
</head>
<body>

<script>
// =====================================================
// サンプルデータ
// =====================================================
// モック固定の「本日」。サンプルデータとの整合性のため固定日付にしている。
// 新規注文の注文日などは自動でこの値が入る仕組みで、本番では実際の当日の日付になる。
const TODAY = "2026-06-11";

// 施工売上の配分ルール（本部確定）。
// 売上から決済代行会社（カード会社等）の手数料を引いた金額をベースに、
// 本部10% / 取次店10% / 施工代理店80% で配分する。
// 決済代行会社が未定のため paymentFeeRate のみ仮置き。決まったらこの値を入れ替えれば全画面に反映される。
let commissionSettings = {
  hqRate: 0.10,          // 本部の取り分
  shopRate: 0.10,        // 取次店の取り分
  contractorRate: 0.80,  // 施工代理店の取り分
  paymentFeeRate: 0.035, // 決済代行会社の手数料率（仮。決済代行会社が決まり次第この値を差し替える）
  paymentFeeConfirmed: false, // 決済代行会社が決まったら true
};
// 1案件ぶんの配分を計算する。
// 各取り分をそれぞれ四捨五入すると合計が元の売上とズレるため（例：85,800円で1円不足）、
// 振込額になる取次店・施工代理店を先に確定させ、残り全額を本部の取り分とする。
// これにより 決済手数料 + 取次店 + 施工代理店 + 本部 = 売上 が必ず一致する。
function splitOf(amount) {
  if (amount == null) return null;
  const fee = Math.round(amount * commissionSettings.paymentFeeRate);
  const base = amount - fee;
  const shop = Math.round(base * commissionSettings.shopRate);
  const contractor = Math.round(base * commissionSettings.contractorRate);
  return { amount, fee, base, shop, contractor, hq: base - shop - contractor };
}
// 複数案件の配分合計。案件ごとに計算してから足す（決済手数料は1件ごとに発生するため）
function splitTotal(orders) {
  return orders.reduce((t, o) => {
    const s = splitOf(o.amount);
    if (s) ["amount", "fee", "base", "shop", "contractor", "hq"].forEach(k => t[k] += s[k]);
    return t;
  }, { amount: 0, fee: 0, base: 0, shop: 0, contractor: 0, hq: 0 });
}
const contractorPayout = amount => { const s = splitOf(amount); return s && s.contractor; };
const shopPayout = amount => { const s = splitOf(amount); return s && s.shop; };

const PREFECTURES = [
  "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
  "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
  "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県",
  "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
  "鳥取県", "島根県", "岡山県", "広島県", "山口県",
  "徳島県", "香川県", "愛媛県", "高知県",
  "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県",
];

// 取次店（施工代理店が開拓・管理する / 中古車販売・パーツ店など）
let shops = [
  { id: 1, code: "SHOP-0001", name: "中古車センターつくば", contractorId: 2, type: "中古車販売", contact: "田村 隆", tel: "029-111-1111", region: "茨城県", status: "稼働中", bank: { bankName: "常陽銀行", branchName: "つくば支店", accountType: "普通", accountNumber: "1111111", accountHolder: "ﾁｭｳｺｼｬｾﾝﾀｰﾂｸﾊﾞ(ｶ" }, joined: "2026-03-01" },
  { id: 2, code: "SHOP-0002", name: "カーパーツ大宮", contractorId: 1, type: "パーツ販売", contact: "小林 誠", tel: "048-222-2222", region: "埼玉県", status: "稼働中", bank: { bankName: "埼玉りそな銀行", branchName: "大宮支店", accountType: "普通", accountNumber: "2222222", accountHolder: "ｶｰﾊﾟｰﾂｵｵﾐﾔ(ｶ" }, joined: "2026-03-10" },
  { id: 3, code: "SHOP-0003", name: "横浜オートガレージ", contractorId: 1, type: "中古車販売", contact: "中村 良太", tel: "045-333-3333", region: "神奈川県", status: "稼働中", bank: { bankName: "横浜銀行", branchName: "横浜支店", accountType: "普通", accountNumber: "3333333", accountHolder: "ﾖｺﾊﾏｵｰﾄｶﾞﾚｰｼﾞ(ｶ" }, joined: "2026-04-02" },
  { id: 4, code: "SHOP-0004", name: "なにわ中古車市場", contractorId: 3, type: "中古車販売", contact: "藤井 健", tel: "06-444-4444", region: "大阪府", status: "稼働中", bank: { bankName: "関西みらい銀行", branchName: "難波支店", accountType: "普通", accountNumber: "4444444", accountHolder: "ﾅﾆﾜﾁｭｳｺｼｬｲﾁﾊﾞ(ｶ" }, joined: "2026-04-20" },

const HOLIDAYS = ["2026-06-15"];
function addBusinessDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    const iso = d.toISOString().slice(0, 10);
    if (dow !== 0 && dow !== 6 && !HOLIDAYS.includes(iso)) added++;
  }
  return d.toISOString().slice(0, 10);
}
function flowHtml(status) {
  const idx = SO_STATUS.indexOf(status);
  return `<div class="flow-steps">${SO_STATUS.map((s, i) => `<div class="flow-step ${i <= idx ? "done" : ""}">${s}</div>`).join("")}</div>`;
}

function mockQrSvg(seed) {
  // モック用の擬似QRパターン（実際はQRライブラリで生成）
  let cells = "";
  let v = seed * 2654435761 % 4294967296;
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
    v = (v * 1103515245 + 12345) % 2147483648;
    const finder = (x < 7 && y < 7) || (x > 21 && y < 7) || (x < 7 && y > 21);
    if (finder) {
      const fx = x > 21 ? x - 22 : x, fy = y > 21 ? y - 22 : y;
      if (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    } else if (v % 100 < 45) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return cells;
}

// =====================================================
// 本部：売上管理・支払管理
// =====================================================
// 支払いは月初から月末までで締める。'YYYY-MM' を扱う。
function monthOf(dateStr) { return (dateStr || "").slice(0, 7); }
function availableMonths() {
  const set = new Set([
    ...serviceOrders.map(o => monthOf(o.date)),
    ...completedOnly(serviceOrders).map(completionMonthOf),
    ...supplyOrders.map(o => monthOf(o.date)),
  ].filter(Boolean));
  return [...set].sort().reverse();
}
let salesMonth = null;   // 売上管理で選択中の月（null = 全期間）
let paymentMonth = null; // 支払管理で選択中の締め月

function ordersInMonth(list, month) { return month ? list.filter(o => monthOf(o.date) === month) : list; }
// キャンセル・返金の可能性があるため、施工代理店・取次店への支払は
// 「施工完了」となった案件だけを対象にする（新規受付〜施工日確定の段階では未確定の売上として扱う）
function completedOnly(list) { return list.filter(o => o.status === "施工完了"); }
function notCompletedOnly(list) { return list.filter(o => o.status !== "施工完了"); }
// 売上の確定と支払の締めは「施工完了日」の月で行う（受付日ではない）。
// 例：6月28日受付・7月3日完了の案件は、7月分の確定売上・支払になる。
function completionMonthOf(o) { return monthOf(o.completedAt || o.scheduled || o.date); }
function completedInMonth(month) {
  const done = completedOnly(serviceOrders);
  return month ? done.filter(o => completionMonthOf(o) === month) : done;
}

function renderHqSales() {
  const el = $("page-hq-sales"); if (!el) return;

  const so = ordersInMonth(serviceOrders, salesMonth);

  const soPending = notCompletedOnly(so);        // 未完了は「受付日」の月で参考表示
  const po = ordersInMonth(supplyOrders, salesMonth);
  const doneTotal = soDone.reduce((s, o) => s + (o.amount || 0), 0);
  const pendingTotal = soPending.reduce((s, o) => s + (o.amount || 0), 0);
  const poTotal = po.reduce((s, o) => s + (poAmount(o) || 0), 0);

  const poShipped = po.filter(o => o.status === "出荷済");
  const poUnshipped = po.filter(o => o.status !== "出荷済");
  const poShippedTotal = poShipped.reduce((s, o) => s + (poAmount(o) || 0), 0);
  const poUnshippedTotal = poUnshipped.reduce((s, o) => s + (poAmount(o) || 0), 0);

  // 施工代理店ごと：施工完了分の売上（確定）と、未完了分（参考）、消耗品の購入額
  const opRows = contractors.map(c => {
    const done = soDone.filter(o => o.contractorId === c.id);
    const pending = soPending.filter(o => o.contractorId === c.id);
    const amount = done.reduce((s, o) => s + (o.amount || 0), 0);
    const pendingAmount = pending.reduce((s, o) => s + (o.amount || 0), 0);
    const supply = po.filter(o => o.contractorId === c.id).reduce((s, o) => s + (poAmount(o) || 0), 0);
    return { name: c.name, count: done.length, amount, pendingCount: pending.length, pendingAmount, supply };
  }).filter(r => r.count || r.pendingCount || r.supply).sort((a, b) => b.amount - a.amount);

  // 取次店ごと：自店経由で入った施工完了分の売上（確定）と未完了分（参考）
  const shopRows = shops.map(s => {
    const done = soDone.filter(o => o.shopId === s.id);
    const pending = soPending.filter(o => o.shopId === s.id);
    const amount = done.reduce((t, o) => t + (o.amount || 0), 0);
    const pendingAmount = pending.reduce((t, o) => t + (o.amount || 0), 0);
    return { name: s.name, parent: opById(s.contractorId).name, count: done.length, amount, pendingCount: pending.length, pendingAmount };
  }).filter(r => r.count || r.pendingCount).sort((a, b) => b.amount - a.amount);

  el.innerHTML = `
    <div class="page-title">売上管理</div>
    <div class="page-desc">施工売上と消耗品売上を、施工代理店別・取次店別に確認できます（表示金額はすべて税込）</div>

          <option value="">全期間</option>
          ${months.map(m => `<option value="${m}" ${m === salesMonth ? "selected" : ""}>${m.replace("-", "年")}月</option>`).join("")}
        </select>
      </div>
      <div></div>
    </div>
    <div class="alert alert-info" style="font-size:12px">💡 キャンセル・返金の可能性があるため、施工売上は<b>「施工完了」となった案件のみ確定売上</b>として、<b>施工完了日の月</b>で計上しています。施工中・確認中の案件は受付日の月に「未完了（参考）」として別に表示し、支払の対象にもしていません。</div>
    <div class="cards-row">
      <div class="card"><div class="stat-label">施工売上（施工完了・確定）</div><div class="stat-value">${yen(doneTotal)}</div><div class="stat-sub">${soDone.length} 件</div></div>

// 月次の支払明細（施工代理店・取次店ごとの配分額）を計算する。
// キャンセル・返金の可能性があるため、支払の対象は「施工完了」の案件のみ。
// 配分は案件ごとに計算してから合算する（決済手数料が1件ごとに発生するため）
function payoutRows(month) {
  const so = completedInMonth(month);
  const rows = [];
  contractors.forEach(c => {
    const jobs = so.filter(o => o.contractorId === c.id);
    const t = splitTotal(jobs);
    if (t.amount) rows.push({ type: "施工代理店", name: c.name, bank: c.bank, count: jobs.length, amount: t.amount, payout: t.contractor });
  });
  shops.forEach(s => {
    const orders = so.filter(o => o.shopId === s.id);
    const t = splitTotal(orders);
    if (t.amount) rows.push({ type: "取次店", name: s.name, bank: s.bank, count: orders.length, amount: t.amount, payout: t.shop });
  });
  return rows;
}

// 振込CSVの出力。関西みらい銀行の正式フォーマットを受領したら、この項目定義を差し替える。
const TRANSFER_CSV_COLUMNS = ["支払区分", "支払先名", "銀行名", "支店名", "預金種目", "口座番号", "口座名義", "振込金額"];
function downloadTransferCsv() {
  const rows = payoutRows(paymentMonth);
  if (!rows.length) { alert("対象月の支払データがありません"); return; }
  const lines = [TRANSFER_CSV_COLUMNS.join(",")];
  rows.forEach(r => {
    const b = r.bank || {};
    lines.push([r.type, r.name, b.bankName || "", b.branchName || "", b.accountType || "", b.accountNumber || "", b.accountHolder || "", r.payout].join(","));
  });
  // Excelで開いたときに文字化けしないようBOMを付ける
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `振込データ_${paymentMonth}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// 本部：請求書管理
// =====================================================
// 発行元（本部）の情報。正式な社名・住所・振込先・登録番号を受領したらここを差し替える。
const ISSUER = {
  name: "（本部 会社名）", address: "（本部 住所）", tel: "（本部 電話番号）",
  bank: "（振込先：銀行名 支店名 口座種別 口座番号 口座名義）",
  regNo: "（適格請求書発行事業者 登録番号 T0000000000000）",
};
// 請求書の管理番号ルール。本部からルールを受領したらこの関数だけ差し替える。
// 仮ルール：INV-YYYYMM-連番3桁（発行月ごとに採番）
function nextInvoiceNumber(dateStr) {
  const ym = (dateStr || TODAY).slice(0, 7).replace("-", "");
  const n = invoices.filter(i => i.id.startsWith("INV-" + ym + "-")).length + 1;
  return `INV-${ym}-${String(n).padStart(3, "0")}`;
}
const TAX_RATE = 0.10;                 // 表示金額は税込のため、請求書上の「内消費税」の計算に使う
const INVOICE_STATUS = ["下書き", "発行済", "入金済"];
// { id, date, dueDate, payeeType: "施工代理店"|"取次店", payeeId, lines:[{productId, qty, unitPrice}], shipping, note, status, orderIds }
let invoices = [];
let editingInvoice = null;

function addDays(dateStr, days) { const d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
function payeeName(inv) { const e = inv.payeeType === "取次店" ? shopById(inv.payeeId) : opById(inv.payeeId); return e ? e.name : "（未選択）"; }
function payeeBank(inv) { const e = inv.payeeType === "取次店" ? shopById(inv.payeeId) : opById(inv.payeeId); return e && e.bank; }
function unitPriceFor(product, payeeType) { return payeeType === "取次店" ? (product.shopPrice || product.price) : product.price; }
function invoiceSubtotal(inv) { return inv.lines.reduce((s, l) => s + (Number(l.unitPrice) || 0) * (Number(l.qty) || 0), 0); }
function invoiceTotal(inv) { return invoiceSubtotal(inv) + (Number(inv.shipping) || 0); }
function invoiceTax(inv) { const t = invoiceTotal(inv); return t - Math.round(t / (1 + TAX_RATE)); }
function invoiceById(id) { return invoices.find(i => i.id === id); }
function invBadge(s) { return `<span class="badge ${s === "入金済" ? "b-green" : s === "発行済" ? "b-blue" : "b-gray"}">${s}</span>`; }

// 消耗品注文から請求書の下書きを自動作成する（明細は注文内容のまま。あとから編集できる）
function createInvoiceFromOrder(poId) {
  const o = supplyOrders.find(x => x.id === poId);
  if (o.invoiceId) { openInvoiceEditor(o.invoiceId); return; }
  const p = prodById(o.productId);
  const inv = {
    id: nextInvoiceNumber(TODAY), date: TODAY, dueDate: addDays(TODAY, 30),
    payeeType: "施工代理店", payeeId: o.contractorId,
    lines: [{ productId: p.id, qty: o.qty, unitPrice: p.price }],
    shipping: shippingFee(p.price * o.qty), note: `消耗品注文 ${o.id}（${o.date}）分`, status: "下書き", orderIds: [o.id],
  };
  invoices.unshift(inv);
  o.invoiceId = inv.id;
  openInvoiceEditor(inv.id);
}
function createBlankInvoice() {
  const inv = { id: nextInvoiceNumber(TODAY), date: TODAY, dueDate: addDays(TODAY, 30), payeeType: "施工代理店", payeeId: contractors[0].id, lines: [], shipping: 0, note: "", status: "下書き", orderIds: [] };
  invoices.unshift(inv);
  openInvoiceEditor(inv.id);
}

                <button class="btn btn-ghost btn-sm" onclick="openInvoicePreview('${i.id}')">プレビュー</button>

                ${i.status === "発行済" ? `<button class="btn btn-success btn-sm" onclick="setInvoiceStatus('${i.id}','入金済')">入金済にする</button>` : ""}
              </td>
            </tr>`).join("") || `<tr><td colspan="8" style="color:var(--muted)">請求書はまだありません</td></tr>`}
        </tbody>
      </table>
    </div>`;

function setInvoiceStatus(id, status) {
  const inv = invoiceById(id); inv.status = status;
  if (status === "入金済") inv.orderIds.forEach(oid => { const o = supplyOrders.find(x => x.id === oid); if (o) o.paid = "入金済"; });
  renderAll();
}

function saveInvoice() {

  if (o.status === "施工日確定") return `<button class="btn btn-primary btn-sm" onclick="openValuablesModal('${o.id}')">施工前確認へ進む</button>`;
  if (o.status === "施工前確認済み") return `<button class="btn btn-primary btn-sm" onclick="completeJob('${o.id}')">施工完了を報告</button>`;
  return "—";
}

// 施工前確認は施工代理店の自己申告ではなく、その場でお客さまにタブレット等で
// 署名してもらい、送信と同時に本部にも記録が残る形にする（施工代理店だけの判断で
// ステータスを進められないようにするための証跡）。
let sigCtx = null, sigDrawing = false, sigHasDrawn = false;

function openValuablesModal(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  openModal(`
    <h2>施工前確認 — ${o.id}</h2>
    <div class="alert alert-warn">📢 ご確認をいただきましたら、ご署名をお願いします。</div>
    <div class="card" style="background:#f8fafc;margin-bottom:14px">
      ・車内に貴重品（財布・スマートフォン・貴金属類など）が残っていないことを確認しました。<br>
      ・車体の傷について、施工前に確認しました。
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px">
      <input type="checkbox" id="valuables-check"> 上記内容を確認しました
    </label>
    <div class="form-group">
      <label>お客さまのご署名（画面に指またはタッチペンでお名前をご記入ください）</label>
      <canvas id="sig-pad" width="560" height="160" style="border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:560px;display:block;cursor:crosshair"></canvas>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;align-self:flex-start" onclick="clearSignature()">✎ 署名をやり直す</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitValuablesCheck('${o.id}')">この内容で本部に送信</button>
    </div>`);
  setupSignaturePad();
}
function setupSignaturePad() {
  const canvas = $("sig-pad");
  sigCtx = canvas.getContext("2d");
  sigCtx.lineWidth = 2.5; sigCtx.lineCap = "round"; sigCtx.strokeStyle = "#2c3e50";
  sigDrawing = false; sigHasDrawn = false;
  const posOf = e => {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
  };
  const start = e => { sigDrawing = true; sigHasDrawn = true; const p = posOf(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = e => { if (!sigDrawing) return; const p = posOf(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = () => { sigDrawing = false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
}
function clearSignature() {
  if (sigCtx) sigCtx.clearRect(0, 0, $("sig-pad").width, $("sig-pad").height);
  sigHasDrawn = false;
}
function submitValuablesCheck(soId) {
  if (!$("valuables-check").checked) { alert("チェックボックスにチェックを入れてください"); return; }
  if (!sigHasDrawn) { alert("お客さまのご署名をご記入ください"); return; }
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工前確認済み";
  o.valuablesSignatureData = $("sig-pad").toDataURL("image/png");
  o.valuablesSignedAt = TODAY; // モックのため申込日を代用。本番では送信時刻を記録
  closeModal(); renderAll();
}
function completeJob(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工完了";
  o.completedAt = TODAY; // 売上の確定・支払の締めはこの日付の月で行う（本番では実際の完了報告日時）
  renderAll();
}
