<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>除菌消臭 事業管理システム（モック v2）</title>
<style>

  #login-screen {

  .login-box .sub { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 24px; }
  .role-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px;
    text-align: left; transition: all .15s;
  }
  .role-btn:hover { border-color: var(--primary); background: #f2f8fd; }
  .role-btn .icon { font-size: 22px; }
  .role-btn b { display: block; }
  .role-btn small { color: var(--muted); font-size: 11px; }
  .login-select { margin-top: 4px; margin-bottom: 14px; }
  .login-select select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

    position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);

  .sidebar h1 { font-size: 14px; padding: 8px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.15); }
  .sidebar h1 small { display: block; font-size: 10px; color: #9db4d0; font-weight: normal; margin-top: 4px; }
  .role-banner { padding: 10px 18px; font-size: 11px; background: rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.1); }
  .role-banner b { display: block; font-size: 13px; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; cursor: pointer; color: #c5d3e6; transition: background .15s; font-size: 13px; }
  .nav-item:hover { background: rgba(255,255,255,.08); }
  .nav-item.active { background: var(--primary); color: #fff; }
  .logout { margin-top: auto; padding: 14px 18px; color: #9db4d0; cursor: pointer; font-size: 12px; border-top: 1px solid rgba(255,255,255,.1); }
  .logout:hover { color: #fff; }
  .main { margin-left: var(--sidebar-w); padding: 24px 28px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 20px; margin-bottom: 4px; }
  .page-desc { color: var(--muted); margin-bottom: 20px; font-size: 13px; }

  /* ===== 部品 ===== */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat-value { font-size: 25px; font-weight: bold; margin-top: 6px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: #f8fafc; }
  .clickable { cursor: pointer; }
  .link { color: var(--primary); cursor: pointer; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .b-blue { background: #eaf2fb; color: var(--primary); }
  .b-green { background: #e8f8ef; color: var(--success); }
  .b-orange { background: #fef5e7; color: var(--warning); }
  .b-red { background: #fdecea; color: var(--danger); }
  .b-purple { background: #f0eafb; color: var(--purple); }
  .b-gray { background: #eef1f5; color: var(--muted); }

  .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type=text], .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(20,30,50,.45); z-index: 100; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; padding: 24px 28px; }
  .modal h2 { font-size: 17px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: bold; }
  .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-bottom: 16px; }
  .detail-item { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .detail-item .k { font-size: 11px; color: var(--muted); }
  .detail-item .v { font-size: 14px; margin-top: 2px; }
  .section-title { font-size: 14px; font-weight: bold; margin: 18px 0 10px; padding-left: 8px; border-left: 3px solid var(--primary); }

  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .alert-warn { background: #fef5e7; color: #b9770e; }
  .alert-danger { background: #fdecea; color: #c0392b; }
  .alert-info { background: #eaf2fb; color: var(--primary-dark); }

  .flow-steps { display: flex; gap: 0; margin: 8px 0 18px; flex-wrap: wrap; }
  .flow-step { padding: 7px 22px 7px 28px; background: #eef1f5; color: var(--muted); font-size: 12px; font-weight: bold; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
  .flow-step.done { background: var(--primary); color: #fff; }

  .proto-note { font-size: 11px; color: #9db4d0; padding: 12px 18px; }

  /* ===== 注文フォーム（お客さま向け） ===== */
  .customer-form-wrap { max-width: 520px; margin: 0 auto; }
  .qr-banner { background: #fff; border: 2px dashed var(--primary); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 13px; }
  .qr-banner b { color: var(--primary); }
  .price-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 14px; font-size: 13px; }
  .price-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .price-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: bold; font-size: 15px; color: var(--primary-dark); }
  .two-col { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>

// 祝日は簡易モックのため未対応（本番では祝日カレンダーAPI等と連携する想定）
const HOLIDAYS = ["2026-06-15"];
function addBusinessDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    const iso = d.toISOString().slice(0, 10);
    if (dow !== 0 && dow !== 6 && !HOLIDAYS.includes(iso)) added++;
  }
  return d.toISOString().slice(0, 10);
}

  { key: "hq", icon: "🏛️", name: "本部", desc: "全体の管理・施工割り当て・受発注管理" },
  { key: "fc", icon: "🏢", name: "加盟店", desc: "自社が獲得した取次店の管理（目標300店）" },
  { key: "shop", icon: "🚙", name: "取次店", desc: "お客さまの取次・注文状況の確認" },
  { key: "op", icon: "🧰", name: "施工代理店", desc: "施工案件の対応・消耗品の発注" },
];

function renderLogin() {
  $("role-select-area").innerHTML = ROLES.map(r => `
    <button class="role-btn" onclick="pickRole('${r.key}')">
      <span class="icon">${r.icon}</span>
      <span><b>${r.name}</b><small>${r.desc}</small></span>
    </button>`).join("");
}
function pickRole(role) {
  if (role === "hq") { login(role, null); return; }
  const list = role === "fc" ? franchises : role === "shop" ? shops : contractors;
  $("role-select-area").innerHTML = `
    <div class="login-select">
      <label style="font-size:12px;color:var(--muted);font-weight:bold">どの${ROLES.find(r => r.key === role).name}としてログインしますか？</label>
      <select id="login-entity" style="margin-top:6px">
        ${list.map(e => `<option value="${e.id}">${e.name}</option>`).join("")}
      </select>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="login('${role}', parseInt(document.getElementById('login-entity').value))">ログイン</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="renderLogin()">← 戻る</button>`;
}
function login(role, entityId) {
  session = { role, entityId };
  $("login-screen").style.display = "none";
  $("sidebar").style.display = "flex";
  $("main").style.display = "block";
  buildUI();
}
function logout() {
  session = { role: null, entityId: null };
  $("login-screen").style.display = "flex";
  $("sidebar").style.display = "none";
  $("main").style.display = "none";
  renderLogin();
}

function entityName() {
  if (session.role === "hq") return "本部 管理者";
  if (session.role === "fc") return fcById(session.entityId).name;
  if (session.role === "shop") return shopById(session.entityId).name;
  return opById(session.entityId).name;
}

function buildUI() {
  const roleDef = ROLES.find(r => r.key === session.role);
  $("role-banner").innerHTML = `${roleDef.icon} ${roleDef.name}としてログイン中<b>${entityName()}</b>`;
  const navs = NAVS[session.role];
  $("nav-area").innerHTML = navs.map((n, i) => `<div class="nav-item ${i === 0 ? "active" : ""}" data-page="${n.id}">${n.icon} ${n.label}</div>`).join("");
  $("main").innerHTML = navs.map((n, i) => `<section class="page ${i === 0 ? "active" : ""}" id="page-${n.id}"></section>`).join("");
  document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      item.classList.add("active");
      $("page-" + item.dataset.page).classList.add("active");
    });
  });
  renderAll();
}

function renderAll() {
  if (session.role === "hq") { renderHqDash(); renderHqSo(); renderHqPo(); renderHqFc(); renderHqShop(); renderHqOp(); renderHqContract(); }
  if (session.role === "fc") { renderFcDash(); renderFcShop(); renderFcContract(); }
  if (session.role === "shop") { renderShopForm(); renderShopOrders(); }
  if (session.role === "op") { renderOpJobs(); renderOpPo(); }
}

// 都道府県が一致する施工代理店を「近い」とみなす簡易距離モック（本番では緯度経度で算出）
function mockDistance(shopPref, c) {
  if (c.prefs.includes(shopPref)) return 0 + (c.id % 5);
  if (c.region && shopPref) return 30 + (c.id * 7) % 50;
  return 999;
}
function openAssignModal(soId) {
  renderAssignList(soId, "");
}
function renderAssignList(soId, prefFilter) {
  const o = serviceOrders.find(x => x.id === soId);
  const shopPref = shopById(o.shopId).region;
  const allPrefs = [...new Set(contractors.flatMap(c => c.prefs))].sort();
  let list = contractors.filter(c => c.status === "稼働中");
  if (prefFilter) list = list.filter(c => c.prefs.includes(prefFilter));
  list = list.map(c => ({ c, dist: mockDistance(shopPref, c) })).sort((a, b) => a.dist - b.dist);
  openModal(`
    <h2>施工代理店の割り当て — ${o.id}</h2>
    <div class="alert alert-info">📍 取次店「${shopById(o.shopId).name}」（${shopPref}）のお客さまです。距離が近い順に表示しています。</div>
    <div class="form-grid">
      <div class="form-group full"><label>都道府県で絞り込み</label>
        <select onchange="renderAssignList('${o.id}', this.value)">
          <option value="">すべて</option>
          ${allPrefs.map(p => `<option value="${p}" ${p === prefFilter ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="card" style="padding:0;margin-top:6px;max-height:320px;overflow-y:auto">
      <table>
        <thead><tr><th>施工代理店</th><th>距離</th><th>対応可能曜日</th><th>直近のNG日</th><th></th></tr></thead>
        <tbody>
          ${list.map(({ c, dist }) => `
            <tr>
              <td><b>${c.name}</b><br><span style="font-size:11px;color:var(--muted)">対応：${c.areas}</span></td>
              <td>${dist === 0 ? "同一都道府県" : dist + "km 相当"}</td>
              <td>${c.availableDays.join("・")}</td>
              <td>${c.ngDates.length ? c.ngDates.join(", ") : "—"}</td>
              <td><button class="btn btn-primary btn-sm" onclick="assignOp('${o.id}', ${c.id})">割り当て</button></td>
            </tr>`).join("") || `<tr><td colspan="5" style="color:var(--muted)">該当する施工代理店がありません</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
    </div>`);
}
function assignOp(soId, contractorId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.contractorId = contractorId;
  o.status = "施工店確認中";

function mockQrSvg(seed) {
  // モック用の擬似QRパターン（実際はQRライブラリで生成）
  let cells = "";
  let v = seed * 2654435761 % 4294967296;
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) {
    v = (v * 1103515245 + 12345) % 2147483648;
    const finder = (x < 7 && y < 7) || (x > 21 && y < 7) || (x < 7 && y > 21);
    if (finder) {
      const fx = x > 21 ? x - 22 : x, fy = y > 21 ? y - 22 : y;
      if (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5)) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    } else if (v % 100 < 45) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return cells;
}

      <input type="checkbox" id="valuables-check"> 上記内容をお客さまに読み上げ、確認いただきました
    </label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitValuablesCheck('${o.id}')">確認済みとして送信</button>
    </div>`);
}
function submitValuablesCheck(soId) {
  if (!$("valuables-check").checked) { alert("チェックボックスにチェックを入れてください"); return; }
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "貴重品確認済み";
  closeModal(); renderAll();
}
function completeJob(soId) {
  const o = serviceOrders.find(x => x.id === soId);
  o.status = "施工完了";
  renderAll();
}

function renderOpPo() {
  const el = $("page-op-po"); if (!el) return;
  const list = supplyOrders.filter(o => o.contractorId === session.entityId);
  el.innerHTML = `
    <div class="page-title">消耗品注文</div>
    <div class="page-desc">除菌消臭剤などの消耗品を本部に注文します</div>
    <div class="toolbar"><div></div><button class="btn btn-primary" onclick="openPoModal()">＋ 消耗品を注文</button></div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>注文番号</th><th>注文日</th><th>商品</th><th>数量</th><th>金額</th><th>入金</th><th>状況</th></tr></thead>
        <tbody>
          ${list.map(o => `<tr><td><b>${o.id}</b></td><td>${o.date}</td><td>${prodById(o.productId).name}</td><td>${o.qty}</td><td>${yen(poAmount(o))}</td><td>${paidBadge(o.paid)}</td><td>${poBadge(o.status)}</td></tr>`).join("") || `<tr><td colspan="7" style="color:var(--muted)">注文履歴はありません</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function openPoModal() {
  openModal(`
    <h2>消耗品を注文</h2>
    <div class="form-grid">
      <div class="form-group full"><label>商品</label>
        <select id="po-product">${products.map(p => `<option value="${p.id}">${p.name}（${yen(p.price)}）</option>`).join("")}</select>
      </div>
      <div class="form-group"><label>数量</label><input type="number" id="po-qty" value="10" min="1"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="savePo()">注文する</button>
    </div>`);
}
function savePo() {
  const num = supplyOrders.length + 1;
  supplyOrders.unshift({
    id: "PO-" + String(num).padStart(4, "0"), date: TODAY, contractorId: session.entityId,
    productId: parseInt($("po-product").value), qty: parseInt($("po-qty").value) || 1,
    status: "受注", paid: "未入金",
  });
  closeModal(); renderAll();
}

// =====================================================
// モーダル共通
// =====================================================
function openModal(html) { $("modal-content").innerHTML = html; $("modal-bg").classList.add("open"); }
function closeModal() { $("modal-bg").classList.remove("open"); }
$("modal-bg").addEventListener("click", e => { if (e.target === $("modal-bg")) closeModal(); });

// 初期表示
renderLogin();
</script>
</body>
</html>
